# gbstage's tests on every push and pull request: the golden cases and the puzzle kit, then Punch-Out!!'s whole
# game on the Joe vs Mac example, one career test a job (the bot, buttons only; what the NES does from
# tests/nes_reference.json: no NES ROM here). The stages that need the NES game itself run locally.
name: Tests

on:
  workflow_dispatch:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_DEPS: pyboy==2.7.0 numpy==2.0.2 pillow==11.3.0

jobs:
  goldens:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install $PYTHON_DEPS
      - id: rgbds
        uses: actions/cache@v4      # (RGBDS once, not downloaded by every job)
        with:
          path: ~/.gbstage
          key: gbstage-rgbds-${{ runner.os }}-${{ hashFiles('gbstage/install.py', 'gbstage/deps.py') }}
      - if: steps.rgbds.outputs.cache-hit != 'true'
        run: python -m gbstage install rgbds
        env:
          GITHUB_TOKEN: ${{ github.token }}   # (its API calls: many jobs at once pass the anonymous limit)
      - run: python -m gbstage test --stage goldens --stage kit

  career:
    runs-on: ubuntu-latest
    timeout-minutes: 150         # (the whole game, bot-played: about 80 on a hosted runner)
    strategy:
      fail-fast: false
      matrix:
        test: [career, losses, routes, pass_key, another_world, original_flow, nes_keys, nes_flows, another_world_won, beat_mac, tells, glitches, another_world_played, random, qa_perf, qa_mac, qa_star, qa_grey, qa_hud, qa_reset, qa_sgb, qa_decision, qa_frames]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install $PYTHON_DEPS
      - id: rgbds
        uses: actions/cache@v4      # (RGBDS once, not downloaded by every job)
        with:
          path: ~/.gbstage
          key: gbstage-rgbds-${{ runner.os }}-${{ hashFiles('gbstage/install.py', 'gbstage/deps.py') }}
      - if: steps.rgbds.outputs.cache-hit != 'true'
        run: python -m gbstage install rgbds
        env:
          GITHUB_TOKEN: ${{ github.token }}   # (its API calls: many jobs at once pass the anonymous limit)
      - run: python -m gbstage test --stage career --career ${{ matrix.test }}
        env:
          SDL_AUDIODRIVER: dummy
